<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Faucet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;background:#2d1b5e;color:#fff;margin:0;padding:16px}
.card{background:#3d2a7a;border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:26px;font-weight:bold}
.small{opacity:.8;font-size:13px}
.task{margin-top:14px}
.btns{display:flex;gap:8px;margin-top:6px}
button{background:#7c4dff;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px}
button.check{background:#2e9e5b}
#msg{margin-top:10px;font-size:14px;color:#ffd666}
</style>
</head>
<body>
<h2>🌙 Moon Faucet</h2>
<div class="card">
  <div class="small">Earnings</div>
  <div class="big" id="bal">...</div>
  <div class="small" id="info"></div>
</div>
<div class="card">
  <b>Tasks</b>
  <div id="msg"></div>
  <div id="tasks">Loading...</div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
const API = new URLSearchParams(location.search).get("api");

const MSG = {
  not_joined: "We can't see you in the channel yet. Join it, then tap Check.",
  already_done: "You already did this task.",
  unavailable: "This task is no longer available.",
  start_first: "Open the bot chat and send /start first.",
  yt_soon: "YouTube checking is coming soon.",
  bad_task: "Something went wrong.",
  unauthorized: "Please close the app and open it again."
};

function usd(x) { return "$" + (x / 1000000).toFixed(4); }

async function call(path, extra) {
  const r = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData: tg.initData }, extra || {}))
  });
  return r.json();
}

function openLink(url) {
  if (url.indexOf("https://t.me/") === 0) tg.openTelegramLink(url);
  else tg.openLink(url);
}

async function load() {
  const bal = document.getElementById("bal");
  const info = document.getElementById("info");
  const box = document.getElementById("tasks");
  if (!API) {
    bal.textContent = "No server address";
    box.textContent = "Open this app from the bot's menu button.";
    return;
  }
  try {
    const me = await call("/api/me");
    if (me.error === "start_first") {
      bal.textContent = "Welcome!";
      box.textContent = "Open the bot chat and send /start first.";
      return;
    }
    if (me.error) { bal.textContent = "Error"; box.textContent = me.error; return; }
    bal.textContent = usd(me.balance);
    info.textContent = "Withdrawable: " + usd(me.available) +
      " | Ad balance: " + usd(me.ad_balance) +
      " | Friends: " + me.referrals;
    const t = await call("/api/tasks");
    box.textContent = "";
    if (!t.tasks || t.tasks.length === 0) {
      box.textContent = "No tasks right now. Come back later!";
      return;
    }
    t.tasks.forEach(function (task) {
      const row = document.createElement("div");
      row.className = "task";
      const label = document.createElement("div");
      label.textContent = task.title + " (" + usd(task.reward) + ")";
      const btns = document.createElement("div");
      btns.className = "btns";
      const start = document.createElement("button");
      start.textContent = "Start";
      start.onclick = function () { openLink(task.link); };
      const check = document.createElement("button");
      check.textContent = "Check ✅";
      check.className = "check";
      check.onclick = async function () {
        check.disabled = true;
        const msg = document.getElementById("msg");
        msg.textContent = "Checking...";
        try {
          const r = await call("/api/check", { task_id: task.id });
          if (r.ok) {
            msg.textContent = "Done! +" + usd(r.reward);
            await load();
          } else {
            msg.textContent = MSG[r.error] || "Could not check. Try again.";
            check.disabled = false;
          }
        } catch (e) {
          msg.textContent = "Can't reach the server. Try again.";
          check.disabled = false;
        }
      };
      btns.appendChild(start);
      btns.appendChild(check);
      row.appendChild(label);
      row.appendChild(btns);
      box.appendChild(row);
    });
  } catch (e) {
    bal.textContent = "Can't reach the server";
    box.textContent = "Is the bot running? Try again in a minute.";
  }
}
load();
</script>
</body>
</html>
